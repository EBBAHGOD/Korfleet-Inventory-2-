{% extends 'inventory/base.html' %}

{% block title %}{% if item %}Edit{% else %}Add{% endif %} Item - Korfleet{% endblock %}

{% block content %}
<div class="form-container">
    <h1>{% if item %}Edit Item{% else %}Add New Item{% endif %}</h1>
    
    <form method="post" class="form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="name">Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" value="{% if item %}{{ item.name }}{% endif %}" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="category">Category <span class="required">*</span></label>
            <select id="category" name="category" required class="form-control">
                <option value="">Select Category</option>
                {% for value, label in categories %}
                <option value="{{ value }}" {% if item and item.category == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if item %}Update{% else %}Add{% endif %} Item</button>
            <a href="{% url 'inventory:inventory_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
